# Erzeugt das Xcode-Projekt der iPhone-App "Showcase Immich".
#
# Das Projekt wird nicht eingecheckt, sondern aus dieser Datei erzeugt:
#   cd ios && xcodegen generate
# Bauen im Simulator:   ./scripts/run-sim.sh      Tests: ./scripts/test.sh      TestFlight: ./scripts/release-ios.sh
name: ShowcaseImmich
options:
  bundleIdPrefix: com.dirk-voss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"
schemes:
  ShowcaseImmich:
    build:
      targets:
        ShowcaseImmich: all
        ShowcaseImmichTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShowcaseImmichTests
    archive:
      config: Release
targets:
  ShowcaseImmich:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Showcase Immich
        CFBundleName: Showcase Immich
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Die Kamera wird nur zum Scannen des QR-Codes deines Servers genutzt."
        NSFaceIDUsageDescription: "Face ID schützt die App, wenn du das in den App-Einstellungen eingeschaltet hast."
        NSLocalNetworkUsageDescription: "Die App verbindet sich mit deinem Immich-Showcase-Server im Heimnetz."
        NSBonjourServices: ["_http._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: com.dirk-voss.showcase
            CFBundleURLSchemes: [showcase]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dirk-voss.showcase
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Showcase Immich App Store"
  ShowcaseImmichTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ShowcaseImmich
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dirk-voss.showcase.tests
