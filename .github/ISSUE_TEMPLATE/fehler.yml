name: Report a problem / Fehler melden
description: Something does not work as expected / Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: was
    attributes:
      label: "What happened? / Was ist passiert?"
      description: "What did you expect, and what happened instead? / Was hast du erwartet, was ist stattdessen geschehen?"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Immich Showcase version
      description: "Shown at the top left of the app (for example v2.6.1) and at /api/config / Steht links oben in der App"
  - type: input
    id: immich
    attributes:
      label: Immich version
  - type: textarea
    id: protokoll
    attributes:
      label: "Log / Protokoll"
      description: "docker compose logs showcase (please remove keys and PINs / bitte ohne Schlüssel und PIN). The support package from the Help window is even better."
      render: shell
  - type: textarea
    id: schritte
    attributes:
      label: "Steps to reproduce / Schritte zum Nachstellen"
