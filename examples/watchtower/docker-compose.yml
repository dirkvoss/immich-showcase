# Automatische Updates fuer Immich Showcase mit Watchtower. Aufrufen aus diesem Ordner:  docker compose up -d
# Aktualisiert nur Container, die das Label com.centurylinklabs.watchtower.enable=true tragen (Immich Showcase hat es schon), jede Nacht um 04:00.
name: watchtower
services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"          # Sekunden Minuten Stunden Tag Monat Wochentag: jeden Tag 04:00
      TZ: Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
