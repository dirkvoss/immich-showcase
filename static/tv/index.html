<script>
(function () {                                  // Kennung des Geraets: aus der Adresse (?ziel=...), sonst aus dem Speicher; sonst Kopplung per Code

  if (z) { window.RW_ZIEL = z; return; }
  window.RW_KOPPELN = true;
  var T = function (t) { return window.RW_T ? window.RW_T(t) : t; };
  function http(methode, pfad, cb) {
    var x = new XMLHttpRequest(); x.open(methode, pfad, true); x.setRequestHeader("X-Rahmen", "1"); x.timeout = 8000;
    x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) {} cb(x.status, d); };
    x.onerror = x.ontimeout = function () { cb(0, null); };

  }
  var el = function (id) { return document.getElementById(id); }, code = "", timer = 0;
  el("kopplung").style.display = "block";
  el("kopplungTitel").textContent = T("Gerät koppeln");
  el("kopplungText").textContent = T("Öffne am Handy Immich Showcase, tippe auf „Geräte“ und gib diesen Code ein:");

  function neuerCode() {
    http("POST", "/api/koppeln/neu", function (st, d) {

  neuerCode();

</script>
